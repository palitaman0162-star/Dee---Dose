<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dee - Dose ระบบเตือนทานยา</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Kanit', sans-serif, system-ui;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        input, select, button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 14px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .med-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .cal-day-name {
            font-weight: bold;
            padding: 5px;
        }

        .cal-date {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 4px;
            min-height: 40px;
            cursor: pointer;
        }

        .cal-date.today {
            background: #e0f2fe;
            border-color: #0284c7;
        }

        .cal-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header & Language & Profile -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>🏥 Dee - Dose</h2>
            <select id="langSelect" onchange="changeLang()">
                <option value="th">🇹🇭 ภาษาไทย</option>
                <option value="en">🇬🇧 English</option>
            </select>
        </div>
        <hr style="margin: 15px 0; border: none; border-top: 1px solid var(--border);">
        <h3 id="t-profileHeader">ข้อมูลผู้ใช้ & คู่หูดูแลสุขภาพ</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <div class="form-group" style="flex:1;">
                <label id="t-genderLabel">เพศ</label>
                <select id="userGender" onchange="saveProfile()">
                    <option value="male">ชาย</option>
                    <option value="female">หญิง</option>
                </select>
            </div>
            <div class="form-group" style="flex:1;">
                <label id="t-ageLabel">ช่วงวัย</label>
                <select id="userAge" onchange="saveProfile()">
                    <option value="child">เด็ก</option>
                    <option value="adult">ผู้ใหญ่</option>
                    <option value="elder">ผู้สูงอายุ</option>
                </select>
            </div>
            <div class="form-group" style="flex:1;">
                <label>คู่หูสัตว์เลี้ยง</label>
                <select id="petSelect" onchange="updatePet()">
                    <option value="🐱">🐱 แมว (Meow)</option>
                    <option value="🐶">🐶 หมา (Bark)</option>
                    <option value="🐦">🐦 นก (Chirp)</option>
                    <option value="🐷">🐷 หมู (Oink)</option>
                </select>
            </div>
        </div>
        <button onclick="requestNotificationPermission()" style="margin-top: 10px; width: 100%; background: #059669;">🔔 เปิดการแจ้งเตือนนอกหน้าเว็บ (Push Notification)</button>
    </div>

    <!-- Quick Presets / Recommendations -->
    <div class="card">
        <h3 id="t-recHeader">💡 ยาน่ารู้ & กดบันทึกด่วน (Quick Presets)</h3>
        <div id="recommendedContainer"></div>
    </div>

    <!-- Add/Edit Medicine Form -->
    <div class="card">
        <h3 id="formTitle">เพิ่มรายการยาใหม่</h3>
        <input type="hidden" id="editId">
        
        <div class="form-group">
            <label id="t-medName">ชื่อยา</label>
            <input type="text" id="medName" placeholder="เช่น พาราสีตามอล">
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex:1;">
                <label id="t-medDose">ขนาดยา</label>
                <input type="text" id="medDose" placeholder="เช่น 500mg">
            </div>
            <div class="form-group" style="flex:1;">
                <label id="t-medAmount">จำนวนต่อครั้ง</label>
                <input type="number" id="medAmount" value="1">
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex:1;">
                <label id="t-medCategory">หมวดหมู่ยา</label>
                <select id="medCategory">
                    <option value="⚪ ยาเม็ด (Tablet)">⚪ ยาเม็ด (Tablet)</option>
                    <option value="💊 แคปซูล (Capsule)">💊 แคปซูล (Capsule)</option>
                    <option value="🥤 ผงละลายน้ำ/ยาน้ำ (Liquid)">🥤 ยาน้ำ/ยาน้ำแขวนตะกอน</option>
                </select>
            </div>
            <div class="form-group" style="flex:1;">
                <label id="t-medMeal">ช่วงเวลาทานยา</label>
                <select id="medMeal">
                    <option value="หลังอาหาร (After Meals)">หลังอาหาร (After Meals)</option>
                    <option value="ก่อนอาหาร (Before Meals)">ก่อนอาหาร (Before Meals)</option>
                    <option value="ก่อนนอน (Before Bed)">ก่อนนอน (Before Bed)</option>
                </select>
            </div>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <div class="form-group" style="flex:1;">
                <label id="t-startDate">วันเริ่มต้น</label>
                <input type="date" id="startDate">
            </div>
            <div class="form-group" style="flex:1;">
                <label id="t-endDate">วันสิ้นสุด</label>
                <input type="date" id="endDate">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 4px;">
                    <input type="checkbox" id="everydayCheck" onchange="toggleEverydayOption()"> 🔄 ทานทุกวัน (ไม่มีวันสิ้นสุด)
                </label>
            </div>
            <div class="form-group" style="flex:1;">
                <label id="t-medTime">เวลาแจ้งเตือน</label>
                <input type="time" id="medTime">
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button id="btnSave" onclick="saveMedicine()" style="flex:1;">บันทึกข้อมูลยา Dee - Dose</button>
            <button id="btnCancel" onclick="resetForm()" style="background:#64748b; display:none;">ยกเลิก</button>
        </div>
    </div>

    <!-- Medicine List -->
    <div class="card">
        <h3 id="t-listHeader">รายการยาที่ต้องรับประทาน</h3>
        <div id="medicineList"></div>
    </div>

    <!-- Calendar -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <button onclick="changeMonth(-1)">&lt;</button>
            <h3 id="calMonthYear" style="margin:0;"></h3>
            <button onclick="changeMonth(1)">&gt;</button>
        </div>
        <div class="cal-grid" id="calDaysName"></div>
        <div class="cal-grid" id="calGrid" style="margin-top:8px;"></div>
    </div>

    <!-- Access Logs -->
    <div class="card">
        <h3>📜 ประวัติการเข้าใช้งานระบบ</h3>
        <table style="width:100%; border-collapse: collapse; font-size: 13px;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border); text-align: left;">
                    <th style="padding: 6px;">เวลา</th>
                    <th style="padding: 6px;">อุปกรณ์</th>
                </tr>
            </thead>
            <tbody id="accessLogList"></tbody>
        </table>
    </div>

</div>

<!-- Modal สรุปประวัติการทานยาประจำวัน -->
<div id="logModal" class="modal">
    <div class="modal-content">
        <h3 id="logDateTitle">📅 ประวัติการทานยา</h3>
        <div id="logContent" style="margin: 15px 0;"></div>
        <button onclick="closeLogModal()" style="width:100%;">ปิดหน้าต่าง</button>
    </div>
</div>

<!-- Modal สัญญาณเตือนเมื่อถึงเวลา -->
<div id="alarmModal" class="modal">
    <div class="modal-content" style="text-align: center;">
        <span id="alarmPet" style="font-size: 60px;">🐱</span>
        <h2 id="t-alarmTitle" style="color: #dc2626; margin: 10px 0;">🚨 ได้เวลาทานยาแล้ว!</h2>
        <p id="petTalk" style="color: #475569;">อย่าลืมทานยาให้ตรงเวลานะครับ!</p>
        <div id="alarmDetails" style="background: #f1f5f9; padding: 10px; border-radius: 8px; margin: 15px 0; text-align: left; font-size: 14px; whitespace: pre-line;"></div>
        <button onclick="stopAlarm()" style="width:100%; background: #22c55e; font-size: 16px; padding: 12px;">✅ ทานยาเรียบร้อยแล้ว</button>
    </div>
</div>

<script>
    let swRegistration = null;
    let medicines = JSON.parse(localStorage.getItem('deedose_items')) || [];
    let logs = JSON.parse(localStorage.getItem('deedose_logs')) || {};
    let profile = JSON.parse(localStorage.getItem('deedose_profile')) || { gender: 'male', age: 'adult', pet: '🐱' };
   
    let currentLang = 'th';
    let alarmInterval = null;
    let audioCtx = null;
    let activeAlarmMed = null;
    let calDate = new Date();

    function unlockAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }
    window.addEventListener('click', unlockAudio, { once: true });
    window.addEventListener('touchstart', unlockAudio, { once: true });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => {
                swRegistration = reg;
            }).catch(err => console.log('Service Worker Registration Failed: ', err));
        });
    }

    const recommendedMeds = [
        {
            name: "พาราสีตามอล (Paracetamol)",
            dose: "500 mg",
            amount: "1",
            category: "⚪ ยาเม็ด (Tablet)",
            meal: "หลังอาหาร (After Meals)",
            time: "08:00",
            propTH: "บรรเทาอาการปวดระดับเล็กน้อยถึงปานกลาง และลดไข้",
            propEN: "Relieves mild to moderate pain and reduces fever."
        },
        {
            name: "เซทิริซีน (Cetirizine)",
            dose: "10 mg",
            amount: "1",
            category: "⚪ ยาเม็ด (Tablet)",
            meal: "ก่อนนอน (Before Bed)",
            time: "21:00",
            propTH: "รักษาอาการแพ้ เช่น น้ำมูกไหล จาม ผื่นคัน คันตา",
            propEN: "Treats allergy symptoms like runny nose, sneezing, and hives."
        },
        {
            name: "ยาธาตุน้ำขาว (Salol & Menthol)",
            dose: "15 ml",
            amount: "1",
            category: "🥤 ผงละลายน้ำ/ยาน้ำ (Liquid)",
            meal: "หลังอาหาร (After Meals)",
            time: "12:00",
            propTH: "แก้ปวดท้อง จุกเสียด แน่นท้อง ท้องเสียถ่ายเป็นน้ำ",
            propEN: "Relieves stomachache, flatulence, and mild diarrhea."
        },
        {
            name: "อม็อกซีซิลลิน (Amoxicillin)",
            dose: "500 mg",
            amount: "1",
            category: "💊 แคปซูล (Capsule)",
            meal: "หลังอาหาร (After Meals)",
            time: "08:00",
            propTH: "ต้านเชื้อแบคทีเรีย รักษาการติดเชื้อทางเดินหายใจ/คออักเสบ",
            propEN: "Antibiotic used to treat bacterial infections."
        },
        {
            name: "ยาแก้ไอ ดักเสมหะ (Bromhexine)",
            dose: "8 mg",
            amount: "1",
            category: "⚪ ยาเม็ด (Tablet)",
            meal: "หลังอาหาร (After Meals)",
            time: "13:00",
            propTH: "ช่วยขับเสมหะ ละลายเสมหะ บรรเทาอาการไอ",
            propEN: "Mucolytic agent for easing coughs with mucus."
        }
    ];

    const dict = {
        th: {
            profileHeader: "ข้อมูลผู้ใช้ & คู่หูดูแลสุขภาพ", genderLabel: "เพศ", ageLabel: "ช่วงวัย",
            recHeader: "💡 ยาน่ารู้ & กดบันทึกด่วน (Quick Presets)",
            formAdd: "เพิ่มรายการยาใหม่", formEdit: "แก้ไขรายการยา",
            medName: "ชื่อยา", medDose: "ขนาดยา (เช่น 500mg, 10ml)", medAmount: "จำนวนต่อครั้ง (กี่เม็ด/กี่ชิ้น)", medCategory: "รูปแบบ / หมวดหมู่ยา", medMeal: "ช่วงเวลาทานยา",
            startDate: "วันเริ่มต้น", endDate: "วันสิ้นสุด", medTime: "เวลาแจ้งเตือน",
            saveBtn: "บันทึกข้อมูลยา Dee - Dose", cancelBtn: "ยกเลิก", listHeader: "รายการยาที่ต้องรับประทาน", calHeader: "ตารางบันทึกการทานยา",
            alarmTitle: "🚨 Dee - Dose ได้เวลาทานยาแล้วนะ!", petTalk: "อย่าลืมทานยาให้ตรงเวลานะครับ!",
            days: ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส']
        },
        en: {
            profileHeader: "User Profile & Health Companion", genderLabel: "Gender", ageLabel: "Age Group",
            recHeader: "💡 Drug Knowledge & Quick Presets",
            formAdd: "Add New Medication", formEdit: "Edit Medication",
            medName: "Medicine Name", medDose: "Dose (e.g. 500mg, 10ml)", medAmount: "Amount per Take", medCategory: "Form / Category", medMeal: "Meal Timing",
            startDate: "Start Date", endDate: "End Date", medTime: "Reminder Time",
            saveBtn: "Save Medication", cancelBtn: "Cancel", listHeader: "Scheduled Medications", calHeader: "Medication Calendar",
            alarmTitle: "🚨 Dee - Dose: Time to take medicine!", petTalk: "Don't forget to take your medicine on time!",
            days: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
        }
    };

    function trackUserAccess() {
        let accessLogs = JSON.parse(localStorage.getItem('deedose_access_history')) || [];
        const now = new Date();
        const dateStr = now.toLocaleString('th-TH');
        const deviceType = /Mobi|Android/i.test(navigator.userAgent) ? '📱 มือถือ (Mobile)' : '💻 คอมพิวเตอร์ (Desktop)';

        accessLogs.unshift({ time: dateStr, device: deviceType });
        if(accessLogs.length > 15) accessLogs.pop();

        localStorage.setItem('deedose_access_history', JSON.stringify(accessLogs));
        renderAccessLogs();
    }

    function renderAccessLogs() {
        const accessLogs = JSON.parse(localStorage.getItem('deedose_access_history')) || [];
        const tbody = document.getElementById('accessLogList');
        if(tbody) {
            tbody.innerHTML = accessLogs.map(l => `<tr><td style="padding:6px;">${l.time}</td><td style="padding:6px;">${l.device}</td></tr>`).join('');
        }
    }

    function requestNotificationPermission() {
        unlockAudio();
        if ('Notification' in window) {
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    alert('เปิดการแจ้งเตือน Dee - Dose เรียบร้อยแล้ว!');
                    showSystemNotification("🏥 Dee - Dose ระบบแจ้งเตือนพร้อมใช้งาน", "ระบบเปิดการแจ้งเตือนเรียบร้อยแล้วครับ");
                } else {
                    alert('การแจ้งเตือนถูกปิดอยู่ โปรดเปิดอนุญาตในตั้งค่าของเบราว์เซอร์');
                }
            });
        } else {
            alert('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือนแบบ Push');
        }
    }

    function showSystemNotification(title, body) {
        if ('Notification' in window && Notification.permission === 'granted') {
            const options = {
                body: body,
                icon: "https://cdn-icons-png.flaticon.com/512/3063/3063822.png",
                badge: "https://cdn-icons-png.flaticon.com/512/3063/3063822.png",
                requireInteraction: true,
                vibrate: [300, 100, 300]
            };

            if (swRegistration) {
                swRegistration.showNotification(title, options);
            } else {
                new Notification(title, options);
            }
        }
    }

    document.getElementById('userGender').value = profile.gender;
    document.getElementById('userAge').value = profile.age;
    document.getElementById('petSelect').value = profile.pet;
    document.getElementById('alarmPet').innerText = profile.pet;

    function saveProfile() {
        profile.gender = document.getElementById('userGender').value;
        profile.age = document.getElementById('userAge').value;
        profile.pet = document.getElementById('petSelect').value;
        localStorage.setItem('deedose_profile', JSON.stringify(profile));
    }

    function updatePet() {
        profile.pet = document.getElementById('petSelect').value;
        document.getElementById('alarmPet').innerText = profile.pet;
        saveProfile();
    }

    function changeLang() {
        currentLang = document.getElementById('langSelect').value;
        const t = dict[currentLang];
        document.getElementById('t-profileHeader').innerText = t.profileHeader;
        document.getElementById('t-genderLabel').innerText = t.genderLabel;
        document.getElementById('t-ageLabel').innerText = t.ageLabel;
        document.getElementById('t-recHeader').innerText = t.recHeader;
        document.getElementById('t-medName').innerText = t.medName;
        document.getElementById('t-medDose').innerText = t.medDose;
        document.getElementById('t-medAmount').innerText = t.medAmount;
        document.getElementById('t-medCategory').innerText = t.medCategory;
        document.getElementById('t-medMeal').innerText = t.medMeal;
        document.getElementById('t-startDate').innerText = t.startDate;
        document.getElementById('t-endDate').innerText = t.endDate;
        document.getElementById('t-medTime').innerText = t.medTime;
        document.getElementById('t-listHeader').innerText = t.listHeader;
        document.getElementById('t-alarmTitle').innerText = t.alarmTitle;
        document.getElementById('petTalk').innerText = t.petTalk;
       
        if(!document.getElementById('editId').value) {
            document.getElementById('formTitle').innerText = t.formAdd;
            document.getElementById('btnSave').innerText = t.saveBtn;
        }
        renderRecommendations();
        renderList();
        renderCalendar();
    }

    function renderRecommendations() {
        const container = document.getElementById('recommendedContainer');
        container.innerHTML = "";
        recommendedMeds.forEach((m, idx) => {
            const prop = currentLang === 'th' ? m.propTH : m.propEN;
            container.innerHTML += `
                <div style="border: 1px solid var(--border); padding: 12px; border-radius: 10px; margin-bottom: 10px;">
                    <h4 style="margin:0 0 4px 0;">💊 ${m.name}</h4>
                    <p style="font-size:13px; color:#475569; margin:4px 0;"><strong>สรรพคุณ:</strong> ${prop}</p>
                    <p style="font-size:12px; color:#64748b; margin:4px 0;"><strong>ขนาดยา:</strong> ${m.dose} | ⏰ เวลาแนะนำ: ${m.time} น.</p>
                    <div style="margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap;">
                        <button onclick="useRecommendation(${idx})" style="padding:6px 10px; font-size:12px; background:#f1f5f9; color:#0f172a; border:1px solid var(--border);">✏️ แก้ไขก่อนบันทึก</button>
                        <button onclick="quickAddPreset(${idx})" style="padding:6px 10px; font-size:12px; background:#22c55e;">⚡ เพิ่มเข้าตารางทันที (ทุกวัน)</button>
                    </div>
                </div>
            `;
        });
    }

    function quickAddPreset(idx) {
        unlockAudio();
        const rec = recommendedMeds[idx];
        const todayStr = new Date().toISOString().split('T')[0];

        const medObj = {
            id: Date.now(),
            name: rec.name,
            dose: rec.dose,
            amount: rec.amount || "1",
            category: rec.category,
            meal: rec.meal,
            start: todayStr,
            end: "2099-12-31",
            isEveryday: true,
            time: rec.time || "08:00"
        };

        medicines.push(medObj);
        localStorage.setItem('deedose_items', JSON.stringify(medicines));
        renderList();
        renderCalendar();
        alert(`เพิ่มรายการ "${rec.name}" เรียบร้อยแล้ว!`);
    }

    function useRecommendation(idx) {
        const rec = recommendedMeds[idx];
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('medName').value = rec.name;
        document.getElementById('medDose').value = rec.dose;
        document.getElementById('medAmount').value = rec.amount || "1";
        document.getElementById('medCategory').value = rec.category;
        document.getElementById('medMeal').value = rec.meal;
        document.getElementById('medTime').value = rec.time || "08:00";
        document.getElementById('startDate').value = todayStr;
       
        const everydayCheck = document.getElementById('everydayCheck');
        if (everydayCheck) everydayCheck.checked = true;
        toggleEverydayOption();

        window.scrollTo({ top: document.getElementById('formTitle').offsetTop - 20, behavior: 'smooth' });
    }

    function toggleEverydayOption() {
        const isEveryday = document.getElementById('everydayCheck')?.checked;
        const endDateInput = document.getElementById('endDate');
        if (endDateInput) {
            if (isEveryday) {
                endDateInput.value = "2099-12-31";
                endDateInput.disabled = true;
            } else {
                endDateInput.disabled = false;
                if (endDateInput.value === "2099-12-31") endDateInput.value = "";
            }
        }
    }

    function saveMedicine() {
        unlockAudio();
        const name = document.getElementById('medName').value.trim();
        const dose = document.getElementById('medDose').value.trim();
        const amount = document.getElementById('medAmount').value;
        const category = document.getElementById('medCategory').value;
        const meal = document.getElementById('medMeal').value;
        const start = document.getElementById('startDate').value;
        const isEveryday = document.getElementById('everydayCheck')?.checked;
        let end = document.getElementById('endDate').value;
        const time = document.getElementById('medTime').value;
        const editId = document.getElementById('editId').value;

        if (isEveryday) {
            end = "2099-12-31";
        }

        if(!name || !dose || !amount || !time || !start || !end) {
            alert(currentLang === 'th' ? "กรุณากรอกข้อมูลให้ครบถ้วนทุกช่อง" : "Please fill in all fields.");
            return;
        }

        const medObj = { id: editId ? Number(editId) : Date.now(), name, dose, amount, category, meal, start, end, isEveryday, time };

        if(editId) {
            medicines = medicines.map(m => m.id == editId ? medObj : m);
        } else {
            medicines.push(medObj);
        }

        localStorage.setItem('deedose_items', JSON.stringify(medicines));
        resetForm();
        renderList();
        renderCalendar();
    }

    function editMed(id) {
        const item = medicines.find(m => m.id === id);
        if(!item) return;
        document.getElementById('editId').value = item.id;
        document.getElementById('medName').value = item.name;
        document.getElementById('medDose').value = item.dose;
        document.getElementById('medAmount').value = item.amount;
        document.getElementById('medCategory').value = item.category;
        document.getElementById('medMeal').value = item.meal;
        document.getElementById('startDate').value = item.start;
        document.getElementById('endDate').value = item.end;
        document.getElementById('medTime').value = item.time;

        const everydayCheck = document.getElementById('everydayCheck');
        if (everydayCheck) {
            everydayCheck.checked = !!item.isEveryday || item.end === "2099-12-31";
            toggleEverydayOption();
        }

        document.getElementById('formTitle').innerText = dict[currentLang].formEdit;
        document.getElementById('btnSave').innerText = dict[currentLang].saveBtn;
        document.getElementById('btnCancel').style.display = "block";
    }

    function deleteMed(id) {
        if(confirm(currentLang === 'th' ? "ยืนยันการลบรายการนี้?" : "Are you sure you want to delete?")) {
            medicines = medicines.filter(m => m.id !== id);
            localStorage.setItem('deedose_items', JSON.stringify(medicines));
            renderList();
            renderCalendar();
        }
    }

    function resetForm() {
        document.getElementById('editId').value = "";
        document.getElementById('medName').value = "";
        document.getElementById('medDose').value = "";
        document.getElementById('medAmount').value = "1";
        document.getElementById('startDate').value = "";
        document.getElementById('endDate').value = "";
        document.getElementById('medTime').value = "";
        const everydayCheck = document.getElementById('everydayCheck');
        if (everydayCheck) {
            everydayCheck.checked = false;
            toggleEverydayOption();
        }
        document.getElementById('formTitle').innerText = dict[currentLang].formAdd;
        document.getElementById('btnSave').innerText = dict[currentLang].saveBtn;
        document.getElementById('btnCancel').style.display = "none";
    }

    function renderList() {
        const container = document.getElementById('medicineList');
        container.innerHTML = "";

        if(medicines.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#94a3b8; padding: 20px 0;">${currentLang === 'th' ? 'ไม่มีรายการยาในระบบ' : 'No medications found.'}</p>`;
            return;
        }

        medicines.forEach(m => {
            const durationText = (m.isEveryday || m.end === "2099-12-31") ? "🔄 ทานทุกวัน (ไม่มีวันสิ้นสุด)" : `📅 ${m.start} ถึง ${m.end}`;
            container.innerHTML += `
                <div class="med-card">
                    <div>
                        <h4 style="margin:0 0 4px 0;">${m.name} (${m.dose})</h4>
                        <p style="margin:2px 0; font-size:13px;"><strong>รูปแบบ:</strong> ${m.category} | <strong>ทานครั้งละ:</strong> ${m.amount} เม็ด/ชิ้น</p>
                        <p style="margin:2px 0; font-size:13px;">📌 <strong>ช่วงเวลา:</strong> ${m.meal}</p>
                        <p style="margin:2px 0; font-size:13px;">${durationText} | ⏰ <strong>${m.time} น.</strong></p>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button onclick="editMed(${m.id})" style="background:#e2e8f0; color:#0f172a;">✏️</button>
                        <button onclick="deleteMed(${m.id})" style="background:#ef4444;">🗑️</button>
                    </div>
                </div>
            `;
        });
    }

    function renderCalendar() {
        const year = calDate.getFullYear();
        const month = calDate.getMonth();
       
        document.getElementById('calMonthYear').innerText = calDate.toLocaleDateString(currentLang === 'th' ? 'th-TH' : 'en-US', { month: 'long', year: 'numeric' });

        const daysNameContainer = document.getElementById('calDaysName');
        daysNameContainer.innerHTML = dict[currentLang].days.map(d => `<div class="cal-day-name">${d}</div>`).join('');

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const grid = document.getElementById('calGrid');
        grid.innerHTML = "";

        for(let i = 0; i < firstDay; i++) {
            grid.innerHTML += `<div></div>`;
        }

        const todayStr = new Date().toISOString().split('T')[0];

        for(let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const isToday = dateStr === todayStr ? 'today' : '';
           
            const hasMeds = medicines.some(m => dateStr >= m.start && dateStr <= m.end);
            const hasLogs = logs[dateStr] && Object.keys(logs[dateStr]).length > 0;

            grid.innerHTML += `
                <div class="cal-date ${isToday}" onclick="openLogModal('${dateStr}')">
                    <span>${d}</span>
                    <div>${hasLogs ? '<span class="cal-dot"></span>' : (hasMeds ? '<span style="font-size:10px; color:#94a3b8;">💊</span>' : '')}</div>
                </div>
            `;
        }
    }

    function changeMonth(offset) {
        calDate.setMonth(calDate.getMonth() + offset);
        renderCalendar();
    }

    function openLogModal(dateStr) {
        document.getElementById('logDateTitle').innerText = `📅 ${dateStr}`;
        const content = document.getElementById('logContent');
        content.innerHTML = "";

        const scheduledMeds = medicines.filter(m => dateStr >= m.start && dateStr <= m.end);

        if(scheduledMeds.length === 0) {
            content.innerHTML = `<p style="color:#64748b; text-align:center;">${currentLang === 'th' ? 'ไม่มีรายการยาที่ต้องทานในวันนี้' : 'No scheduled medicines for this date.'}</p>`;
        } else {
            scheduledMeds.forEach(m => {
                const isTaken = logs[dateStr] && logs[dateStr][m.id];
                content.innerHTML += `
                    <div style="margin-bottom:10px; padding:10px; border:1px solid var(--border); border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong>${m.name}</strong> (${m.dose})<br>
                            <small>${m.amount} เม็ด/ชิ้น [${m.meal}] - ⏰ ${m.time} น.</small>
                        </div>
                        <input type="checkbox" ${isTaken ? 'checked' : ''} onchange="toggleMedLog('${dateStr}', ${m.id}, this.checked)" style="width:20px; height:20px; cursor:pointer;">
                    </div>
                `;
            });
        }

        document.getElementById('logModal').style.display = "flex";
    }

    function toggleMedLog(dateStr, medId, isChecked) {
        if(!logs[dateStr]) logs[dateStr] = {};
        if(isChecked) {
            logs[dateStr][medId] = true;
        } else {
            delete logs[dateStr][medId];
        }
        localStorage.setItem('deedose_logs', JSON.stringify(logs));
        renderCalendar();
    }

    function closeLogModal() {
        document.getElementById('logModal').style.display = "none";
    }

    function playPetSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
           
            const pet = profile.pet || '🐱';
            const now = audioCtx.currentTime;

            if (pet === '🐱') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(420, now);
                osc.frequency.exponentialRampToValueAtTime(780, now + 0.25);
                osc.frequency.exponentialRampToValueAtTime(360, now + 0.65);
               
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.4, now + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.65);

            } else if (pet === '🐶') {
                [0, 0.18].forEach(delay => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(170, now + delay);
                    osc.frequency.exponentialRampToValueAtTime(75, now + delay + 0.11);

                    gain.gain.setValueAtTime(0.5, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.11);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.11);
                });

            } else if (pet === '🐦') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(2200, now);
                osc.frequency.linearRampToValueAtTime(3200, now + 0.08);
                osc.frequency.linearRampToValueAtTime(1900, now + 0.16);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.16);

            } else if (pet === '🐷') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(90, now + 0.2);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
        } catch(e) {
            console.log("Audio play error: ", e);
        }
    }

    function triggerAlarm(med) {
        activeAlarmMed = med;
        document.getElementById('alarmDetails').innerText = `💊 ยา: ${med.name} (${med.dose})\n📌 จำนวน: ${med.amount} เม็ด/ชิ้น [${med.meal}]\n⏰ เวลา: ${med.time} น.`;
        document.getElementById('alarmModal').style.display = "flex";

        showSystemNotification(
            `🚨 Dee - Dose ได้เวลาทานยาแล้ว! (${profile.pet || '🐱'})`,
            `ยา: ${med.name} (${med.dose}) - ทาน ${med.amount} เม็ด [${med.meal}]`
        );

        if(!alarmInterval) {
            playPetSound();
            alarmInterval = setInterval(() => { playPetSound(); }, 1200);
        }
    }

    function stopAlarm() {
        document.getElementById('alarmModal').style.display = "none";
        if(alarmInterval) {
            clearInterval(alarmInterval);
            alarmInterval = null;
        }

        if(activeAlarmMed) {
            const todayStr = new Date().toISOString().split('T')[0];
            toggleMedLog(todayStr, activeAlarmMed.id, true);
            activeAlarmMed = null;
        }
    }

    setInterval(() => {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const todayStr = `${year}-${month}-${day}`;
       
        const hours = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        const timeStr = `${hours}:${mins}`;

        if(secs === "00") {
            medicines.forEach(m => {
                if(todayStr >= m.start && todayStr <= m.end && m.time === timeStr) {
                    triggerAlarm(m);
                }
            });
        }
    }, 1000);

    trackUserAccess();
    renderRecommendations();
    renderList();
    renderCalendar();
</script>

</body>
</html>
